<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07162d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="King Air Kev">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>King Air Kev</title>
<style>
:root{--ink:#07162d;--cream:#fff4ce;--gold:#ffc936;--red:#ed3b39;--blue:#39c5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030814;color:white;font-family:ui-monospace,"Courier New",monospace;touch-action:none}
body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;background:var(--ink);overflow:hidden;box-shadow:0 0 60px #000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));text-align:center;background:radial-gradient(circle at 50% 22%,#173c66,#07162d 58%,#020612);z-index:5}
.hidden{display:none}.logo{font-weight:1000;font-size:clamp(42px,13vw,70px);line-height:.83;letter-spacing:-4px;color:var(--cream);text-shadow:4px 4px 0 #e34d2f,8px 8px 0 #061022;transform:rotate(-2deg);margin:12px 0 18px}.logo span{display:block;color:var(--gold);font-size:.72em}
.badge{background:var(--red);border:4px solid var(--cream);box-shadow:5px 5px 0 #020612;padding:6px 12px;font-weight:900;transform:rotate(2deg);margin-bottom:12px}.kev{font-size:92px;filter:drop-shadow(5px 6px 0 #000);animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-7px)}}.sub{max-width:340px;color:#cbe8ff;line-height:1.4;font-weight:bold}.buttons{display:grid;gap:12px;width:min(100%,330px);margin-top:20px}
button{appearance:none;border:4px solid #fff4ce;border-radius:2px;background:#1670a8;color:white;padding:15px 12px;font:900 18px ui-monospace,monospace;letter-spacing:1px;box-shadow:5px 5px 0 #020612;text-transform:uppercase}button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #020612}.primary{background:#e64b32}.easy{background:#168f65}.medium{background:#c37a13}.hard{background:#b5263d}
#hud{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;font-weight:1000;text-shadow:2px 2px #000;pointer-events:none}.hudBox{background:#07162dcc;border:2px solid #fff4ce;padding:6px 8px;box-shadow:3px 3px #000}.hearts{color:#ff4b4b}
#controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:0 18px calc(15px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.ctrl{pointer-events:auto;width:104px;height:70px;border-radius:12px;background:#07162dcf;font-size:33px;user-select:none}
.small{font-size:12px;color:#8bbbd6;margin-top:14px}.resultTitle{font-size:38px;color:var(--gold);text-shadow:4px 4px #000;margin:8px}.scoreBig{font-size:24px;margin:10px}.flash{animation:flash .18s steps(2) 5}@keyframes flash{50%{opacity:.1}}
</style>
</head>
<body><main class="shell" id="shell">
<canvas id="game" width="390" height="844"></canvas>
<div id="hud" class="hidden"><div class="hudBox" id="levelHud">LEVEL 1</div><div class="hudBox"><span id="scoreHud">00000</span> <span class="hearts" id="heartsHud">♥♥♥</span></div></div>
<div id="controls" class="hidden"><button class="ctrl" id="left" aria-label="Move left">◀</button><button class="ctrl" id="right" aria-label="Move right">▶</button></div>
<section id="menu" class="screen"><div class="badge">16-BIT FLIGHT MAYHEM</div><div class="logo">KING AIR<span>KEV</span></div><div class="kev">👨🏻‍✈️</div><p class="sub">Guide Kev's King Air through three increasingly ridiculous flights. Dodge everything. Try not to bend the aeroplane.</p><div class="buttons"><button class="primary" id="start">Start engines</button></div><div class="small">HEADPHONES ON · PORTRAIT MODE</div></section>
<section id="difficulty" class="screen hidden"><div class="logo" style="font-size:46px">CHOOSE<span>DIFFICULTY</span></div><div class="buttons"><button class="easy" data-diff="easy">Easy · Training</button><button class="medium" data-diff="medium">Medium · Line Check</button><button class="hard" data-diff="hard">Hard · Kev Mode</button></div></section>
<section id="brief" class="screen hidden"><div class="badge" id="briefBadge">LEVEL 1</div><div class="resultTitle" id="briefTitle">BIRD STRIKE ALLEY</div><div class="kev" id="briefIcon">🛩️</div><p class="sub" id="briefText"></p><div class="buttons"><button class="primary" id="launch">Let's fly</button></div></section>
<section id="result" class="screen hidden"><div class="kev" id="resultIcon">😢</div><div class="resultTitle" id="resultTitle">AIRCRAFT BENT!</div><p class="sub" id="resultText"></p><div class="scoreBig" id="resultScore"></div><div class="buttons"><button class="primary" id="resultButton">Retry</button><button id="menuButton">Main menu</button></div></section>
</main>
<script>
"use strict";
const C=document.querySelector("#game"),X=C.getContext("2d"),W=C.width,H=C.height;
const screens=[...document.querySelectorAll(".screen")],hud=q("#hud"),controls=q("#controls"),shell=q("#shell");
const cfg={easy:{speed:175,spawn:1.05,mult:1},medium:{speed:220,spawn:.78,mult:1.5},hard:{speed:275,spawn:.57,mult:2}};
const levels=[
 {name:"BIRD STRIKE ALLEY",text:"Walney runway is full of birds. Steer left and right, avoid three strikes and reach rotation.",icon:"🐦",duration:58},
 {name:"TURBULENCE TROUBLE",text:"Climb through storm clouds. Dodge lightning, balloons and baggage that definitely wasn't secured.",icon:"⛈️",duration:62},
 {name:"CITY APPROACH",text:"Thread the skyline on final. Avoid towers, drones and suspiciously tall cranes.",icon:"🏙️",duration:68}
];
let state="menu",difficulty="medium",level=0,score=0,hits=0,elapsed=0,last=0,spawnClock=0,objects=[],particles=[],keys={left:false,right:false},audio=null,musicTimer=null;
let plane={x:195,y:665,w:60,h:88,tilt:0,inv:0};
function q(s){return document.querySelector(s)}
function show(id){screens.forEach(s=>s.classList.add("hidden"));q(id).classList.remove("hidden")}
function resize(){const r=C.getBoundingClientRect();C.width=Math.round(r.width*devicePixelRatio);C.height=Math.round(r.height*devicePixelRatio);X.setTransform(C.width/W,0,0,C.height/H,0,0)}
addEventListener("resize",resize);resize();
function startAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();let step=0;musicTimer=setInterval(()=>{if(!audio||audio.state!=="running")return;const notes=[110,165,220,165,131,196,262,196],o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=notes[step++%notes.length];g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.14)},165)}
function sfx(type){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==="hit"?"sawtooth":"square";o.frequency.setValueAtTime(type==="hit"?180:440,t);o.frequency.exponentialRampToValueAtTime(type==="hit"?55:880,t+.18);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(audio.destination);o.start();o.stop(t+.21)}
q("#start").onclick=()=>{startAudio();show("#difficulty")};
document.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;score=0;level=0;brief()});
function brief(){const l=levels[level];q("#briefBadge").textContent="LEVEL "+(level+1)+" OF 3";q("#briefTitle").textContent=l.name;q("#briefIcon").textContent=l.icon;q("#briefText").textContent=l.text;show("#brief")}
q("#launch").onclick=begin;
function begin(){state="play";hits=0;elapsed=0;spawnClock=0;objects=[];particles=[];plane.x=W/2;plane.inv=0;last=performance.now();screens.forEach(s=>s.classList.add("hidden"));hud.classList.remove("hidden");controls.classList.remove("hidden");updateHud();requestAnimationFrame(loop)}
function updateHud(){q("#levelHud").textContent="LEVEL "+(level+1)+" · "+Math.max(0,Math.ceil(levels[level].duration-elapsed))+"s";q("#scoreHud").textContent=String(Math.max(0,Math.floor(score))).padStart(5,"0");q("#heartsHud").textContent="♥".repeat(3-hits)+"♡".repeat(hits)}
function bind(btn,key){const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};btn.addEventListener("pointerdown",on);btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("pointerleave",off)}
bind(q("#left"),"left");bind(q("#right"),"right");
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")keys.left=true;if(e.key==="ArrowRight")keys.right=true});addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;if(e.key==="ArrowRight")keys.right=false});
function spawn(){const c=cfg[difficulty],size=level===0?26+Math.random()*18:level===1?30+Math.random()*22:34+Math.random()*27;objects.push({x:28+Math.random()*(W-56),y:-60,w:size,h:size,type:Math.random(),speed:c.speed*(.82+Math.random()*.45)*(1+level*.12),phase:Math.random()*6.28,hit:false})}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.35&&Math.abs(a.y-b.y)<(a.h+b.h)*.36}
function impact(o){if(o.hit||plane.inv>0)return;o.hit=true;hits++;score=Math.max(0,score-500);plane.inv=1.25;shell.classList.remove("flash");void shell.offsetWidth;shell.classList.add("flash");sfx("hit");navigator.vibrate?.([80,40,80]);for(let i=0;i<14;i++)particles.push({x:plane.x,y:plane.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.7});updateHud();if(hits>=3)end(false)}
function loop(now){if(state!=="play")return;const dt=Math.min(.033,(now-last)/1000);last=now;tick(dt);draw();if(state==="play")requestAnimationFrame(loop)}
function tick(dt){const c=cfg[difficulty],dir=(keys.right?1:0)-(keys.left?1:0);plane.x+=dir*245*dt;plane.x=Math.max(42,Math.min(W-42,plane.x));plane.tilt+=(dir*-.32-plane.tilt)*.16;plane.inv=Math.max(0,plane.inv-dt);elapsed+=dt;score+=dt*100*c.mult*(1+level*.35);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=c.spawn*(.72+Math.random()*.55)/(1+level*.12)}
objects.forEach(o=>{o.y+=o.speed*dt;o.x+=Math.sin(elapsed*2+o.phase)*(level===1?28:10)*dt;if(collide(plane,o))impact(o)});objects=objects.filter(o=>o.y<H+80&&!o.hit);
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0);updateHud();if(elapsed>=levels[level].duration)end(true)}
function pxRect(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function bg(){const t=elapsed;
if(level===0){pxRect(0,0,W,H,"#527d46");pxRect(48,0,W-96,H,"#454b52");for(let y=((t*cfg[difficulty].speed)%90)-90;y<H;y+=90){pxRect(W/2-4,y,8,46,"#f7f0bf")}pxRect(48,0,8,H,"#fff4ce");pxRect(W-56,0,8,H,"#fff4ce")}
if(level===1){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#14365b");g.addColorStop(1,"#72b5cf");X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<8;i++){const y=(i*137+t*55)%930-60,x=(i*83)%W;X.fillStyle="#d8e2e6aa";X.beginPath();X.arc(x,y,30,0,7);X.arc(x+31,y+5,25,0,7);X.fill()}}
if(level===2){pxRect(0,0,W,H,"#ef8e59");pxRect(0,H*.35,W,H*.65,"#18233d");for(let i=0;i<9;i++){const bw=36+(i%3)*11,bh=150+(i*53)%280,x=i*51-18;pxRect(x,H-bh,bw,bh,i%2?"#273551":"#303e5d");for(let yy=H-bh+18;yy<H-20;yy+=26)for(let xx=x+8;xx<x+bw-5;xx+=17)pxRect(xx,yy,6,9,(i+yy/26)%3?"#ffd65c":"#7591a8")}}
}
function drawPlane(){X.save();X.translate(plane.x,plane.y);X.rotate(plane.tilt);if(plane.inv>0&&Math.floor(plane.inv*12)%2===0)X.globalAlpha=.25;X.fillStyle="#f0eee3";X.beginPath();X.moveTo(0,-46);X.lineTo(11,-13);X.lineTo(48,8);X.lineTo(46,20);X.lineTo(10,13);X.lineTo(8,39);X.lineTo(20,47);X.lineTo(18,52);X.lineTo(0,47);X.lineTo(-18,52);X.lineTo(-20,47);X.lineTo(-8,39);X.lineTo(-10,13);X.lineTo(-46,20);X.lineTo(-48,8);X.lineTo(-11,-13);X.closePath();X.fill();pxRect(-6,-25,12,42,"#2374a3");pxRect(-35,10,12,8,"#111");pxRect(23,10,12,8,"#111");X.restore()}
function drawObject(o){X.save();X.translate(o.x,o.y);X.font=Math.round(o.w)+"px serif";X.textAlign="center";X.textBaseline="middle";let a;if(level===0)a=o.type<.72?"🐦":"🦆";else if(level===1)a=o.type<.42?"⚡":o.type<.7?"🎈":"🧳";else a=o.type<.42?"🚁":o.type<.72?"🚁":"🏗️";X.fillText(a,0,0);X.restore()}
function draw(){bg();objects.forEach(drawObject);drawPlane();particles.forEach(p=>pxRect(p.x,p.y,5,5,p.t>.35?"#ffd43b":"#ee493b"))}
function end(win){if(state!=="play")return;state="ended";hud.classList.add("hidden");controls.classList.add("hidden");keys.left=keys.right=false;if(win){score+=1000*(level+1)*cfg[difficulty].mult;sfx("win");if(level<2){level++;q("#resultIcon").textContent="😎";q("#resultTitle").textContent="LEVEL CLEARED!";q("#resultText").textContent="Kev and the King Air survive. Somehow. Next up: "+levels[level].name+".";q("#resultButton").textContent="Next level";q("#resultButton").onclick=brief}else{q("#resultIcon").textContent="🏆";q("#resultTitle").textContent="LINE RELEASED!";q("#resultText").textContent="All three sectors complete. Kev lives to fly another day.";q("#resultButton").textContent="Fly again";q("#resultButton").onclick=()=>{score=0;level=0;brief()}}}else{q("#resultIcon").textContent="😭";q("#resultTitle").textContent="AIRCRAFT BENT!";q("#resultText").textContent="Three hits. Engineering would like a quiet word with Kev.";q("#resultButton").textContent="Retry level";q("#resultButton").onclick=begin}q("#resultScore").textContent="SCORE "+Math.floor(score);show("#result")}
q("#menuButton").onclick=()=>{state="menu";hud.classList.add("hidden");controls.classList.add("hidden");show("#menu")};
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
bg();drawPlane();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07162d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="King Air Kev">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
<title>King Air Kev</title>
<style>
:root{--ink:#05052b;--cream:#fff7c7;--gold:#ffe12b;--red:#ff246d;--blue:#00eaff;--purple:#741cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030814;color:white;font-family:ui-monospace,"Courier New",monospace;touch-action:none}
body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;background:var(--ink);overflow:hidden;box-shadow:0 0 60px #000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(180deg,#080845f2,#120532f2 55%,#03031df8);z-index:5}
.hidden{display:none}.logo{font-weight:1000;font-size:clamp(42px,13vw,70px);line-height:.88;letter-spacing:-4px;background:linear-gradient(#eaffff 5%,#00eaff 35%,#f226ff 65%,#ffe12b 88%);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:5px 5px 0 #080027,8px 8px 0 #ff178e;transform:skew(-3deg);margin:12px 0 18px}.logo span{display:block;color:var(--gold);font-size:.66em;-webkit-text-stroke:1px #ff246d;text-shadow:4px 4px #6c006f}
.badge{background:var(--red);border:4px solid var(--cream);box-shadow:5px 5px 0 #020612;padding:6px 12px;font-weight:900;transform:rotate(2deg);margin-bottom:12px}.kev{font-size:92px;filter:drop-shadow(5px 6px 0 #000);animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-7px)}}.sub{max-width:340px;color:#cbe8ff;line-height:1.4;font-weight:bold}.buttons{display:grid;gap:12px;width:min(100%,330px);margin-top:20px}
button{appearance:none;border:4px solid #fff4ce;border-radius:2px;background:#1670a8;color:white;padding:15px 12px;font:900 18px ui-monospace,monospace;letter-spacing:1px;box-shadow:5px 5px 0 #020612;text-transform:uppercase}button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #020612}.primary{background:#e64b32}.easy{background:#168f65}.medium{background:#c37a13}.hard{background:#b5263d}
#hud{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;font-weight:1000;text-shadow:2px 2px #000;pointer-events:none}.hudBox{background:#07162dcc;border:2px solid #fff4ce;padding:6px 8px;box-shadow:3px 3px #000}.hearts{color:#ff4b4b}
#controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:0 18px calc(15px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.ctrl{pointer-events:auto;width:104px;height:70px;border-radius:12px;background:#07162dcf;font-size:33px;user-select:none}
.small{font-size:12px;color:#00eaff;margin-top:14px}.resultTitle{font-size:34px;color:var(--gold);text-shadow:3px 3px #ff167d,6px 6px #000;margin:8px}.scoreBig{font-size:24px;margin:10px}.flash{animation:flash .18s steps(2) 5}@keyframes flash{50%{opacity:.1}}
.shell:after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0004 4px);mix-blend-mode:multiply}
#boot{background:linear-gradient(#03002b22,#05001c55);justify-content:space-between;padding-top:calc(38px + env(safe-area-inset-top))}
#boot .logo{font-size:clamp(48px,14vw,72px);margin:8px 0 0}#boot .tag{font-size:clamp(26px,8vw,43px);font-style:italic;color:#ffe323;-webkit-text-stroke:1px #ff177d;text-shadow:4px 4px #78005f;transform:skew(-10deg);font-weight:1000}
.loadWrap{width:88%;margin-bottom:calc(25px + env(safe-area-inset-bottom));filter:drop-shadow(0 0 8px #00eaff)}.loadFrame{height:31px;border:5px solid #00eaff;background:#14002d;box-shadow:0 0 0 4px #070018,0 0 0 7px #5e18ff;padding:3px}.loadFill{height:100%;width:0;background:repeating-linear-gradient(90deg,#ffe72b 0 24px,#ff791f 24px 28px);transition:width .08s linear}.tap{margin-top:12px;color:#fff;font-weight:1000;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.pixelKev{position:relative;width:102px;height:110px;background:#f3a36d;border:6px solid #070018;box-shadow:8px 8px #ff168b;margin:8px;clip-path:polygon(18% 8%,82% 8%,96% 30%,91% 74%,70% 100%,30% 100%,9% 74%,4% 30%)}.pixelKev:before{content:"";position:absolute;left:15px;right:15px;top:43px;height:12px;border-left:13px solid #07142e;border-right:13px solid #07142e;box-shadow:0 31px 0 7px #69352b}.pixelKev:after{content:"";position:absolute;left:37px;top:69px;width:21px;height:7px;background:#fff;box-shadow:0 12px #47221e}.pixelBadge{display:grid;place-items:center;width:106px;height:80px;background:#ff246d;border:5px solid #00eaff;box-shadow:7px 7px #080018;font-weight:1000;font-size:20px;color:#ffe12b}.miniSprite{width:94px;height:60px;margin:12px;background:linear-gradient(155deg,transparent 35%,#f7f2df 36% 60%,transparent 61%);filter:drop-shadow(6px 5px #ff168b) drop-shadow(-4px -2px #00eaff)}
</style>
</head>
<body><main class="shell" id="shell">
<canvas id="game" width="390" height="844"></canvas>
<div id="hud" class="hidden"><div class="hudBox" id="levelHud">LEVEL 1</div><div class="hudBox"><span id="scoreHud">00000</span> <span class="hearts" id="heartsHud">♥♥♥</span></div></div>
<div id="controls" class="hidden"><button class="ctrl" id="left" aria-label="Move left">◀</button><button class="ctrl" id="right" aria-label="Move right">▶</button></div>
<section id="boot" class="screen"><div><div class="logo">KING AIR KEV</div><div class="tag">LIGHTNING STRIKES</div></div><div class="loadWrap"><div class="loadFrame"><div class="loadFill" id="loadFill"></div></div><button class="primary tap" id="bootButton">TAP TO START</button></div></section>\n<section id="menu" class="screen hidden"><div class="badge">16-BIT FLIGHT MAYHEM</div><div class="logo">KING AIR<span>KEV</span></div><div class="pixelKev" aria-label="Pixel art Kev"></div><p class="sub">Guide Kev's King Air through three increasingly ridiculous flights. Dodge everything. Try not to bend the aeroplane.</p><div class="buttons"><button class="primary" id="start">Start engines</button></div><div class="small">HEADPHONES ON · PORTRAIT MODE</div></section>
<section id="difficulty" class="screen hidden"><div class="logo" style="font-size:46px">CHOOSE<span>DIFFICULTY</span></div><div class="buttons"><button class="easy" data-diff="easy">Easy · Training</button><button class="medium" data-diff="medium">Medium · Line Check</button><button class="hard" data-diff="hard">Hard · Kev Mode</button></div></section>
<section id="brief" class="screen hidden"><div class="badge" id="briefBadge">LEVEL 1</div><div class="resultTitle" id="briefTitle">BIRD STRIKE ALLEY</div><div class="miniSprite" id="briefIcon"></div><p class="sub" id="briefText"></p><div class="buttons"><button class="primary" id="launch">Let's fly</button></div></section>
<section id="result" class="screen hidden"><div class="pixelBadge" id="resultIcon">KEV</div><div class="resultTitle" id="resultTitle">AIRCRAFT BENT!</div><p class="sub" id="resultText"></p><div class="scoreBig" id="resultScore"></div><div class="buttons"><button class="primary" id="resultButton">Retry</button><button id="menuButton">Main menu</button></div></section>
</main>
<script>
"use strict";
const C=document.querySelector("#game"),X=C.getContext("2d"),W=C.width,H=C.height;
const screens=[...document.querySelectorAll(".screen")],hud=q("#hud"),controls=q("#controls"),shell=q("#shell");
const cfg={easy:{speed:175,spawn:1.05,mult:1},medium:{speed:220,spawn:.78,mult:1.5},hard:{speed:275,spawn:.57,mult:2}};
const levels=[
 {name:"BIRD STRIKE ALLEY",text:"Walney runway is full of birds. Steer left and right, avoid three strikes and reach rotation.",duration:20},
 {name:"TURBULENCE TROUBLE",text:"Climb through storm clouds. Dodge lightning, balloons and baggage that definitely wasn't secured.",duration:20},
 {name:"CITY APPROACH",text:"Thread the skyline on final. Avoid towers, drones and suspiciously tall cranes.",duration:20}
];
let state="boot",difficulty="medium",level=0,score=0,hits=0,elapsed=0,last=0,spawnClock=0,objects=[],particles=[],keys={left:false,right:false},audio=null,musicTimer=null;
let plane={x:195,y:665,w:60,h:88,tilt:0,inv:0};
function q(s){return document.querySelector(s)}
function show(id){screens.forEach(s=>s.classList.add("hidden"));q(id).classList.remove("hidden")}
function resize(){const r=C.getBoundingClientRect();C.width=Math.round(r.width*devicePixelRatio);C.height=Math.round(r.height*devicePixelRatio);X.setTransform(C.width/W,0,0,C.height/H,0,0)}
addEventListener("resize",resize);resize();
function tone(freq,dur,vol=.035,type="square"){if(!audio||audio.state!=="running")return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}
function startAudio(){if(audio){audio.resume();return}audio=new (window.AudioContext||window.webkitAudioContext)();let step=0;const lead=[330,392,494,659,494,392,330,247,294,370,494,587,494,370,294,220],bass=[82,82,110,110,73,73,98,98];musicTimer=setInterval(()=>{tone(lead[step%lead.length],.12,.035,"square");if(step%2===0)tone(bass[(step/2)%bass.length],.28,.028,"triangle");if(step%4===0)tone(55,.05,.05,"square");step++},145)}
function sfx(type){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==="hit"?"sawtooth":"square";o.frequency.setValueAtTime(type==="hit"?180:440,t);o.frequency.exponentialRampToValueAtTime(type==="hit"?55:880,t+.18);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(audio.destination);o.start();o.stop(t+.21)}
q("#bootButton").onclick=()=>{startAudio();q("#bootButton").classList.add("hidden");let p=0;const id=setInterval(()=>{p+=4+Math.random()*8;q("#loadFill").style.width=Math.min(100,p)+"%";if(p>=100){clearInterval(id);setTimeout(()=>{state="menu";show("#menu")},280)}},90)};
q("#start").onclick=()=>{show("#difficulty")};
document.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;score=0;level=0;brief()});
function brief(){const l=levels[level];q("#briefBadge").textContent="LEVEL "+(level+1)+" OF 3";q("#briefTitle").textContent=l.name;q("#briefIcon").dataset.level=level;q("#briefText").textContent=l.text;show("#brief")}
q("#launch").onclick=begin;
function begin(){state="play";hits=0;elapsed=0;spawnClock=0;objects=[];particles=[];plane.x=W/2;plane.inv=0;last=performance.now();screens.forEach(s=>s.classList.add("hidden"));hud.classList.remove("hidden");controls.classList.remove("hidden");updateHud();requestAnimationFrame(loop)}
function updateHud(){q("#levelHud").textContent="LEVEL "+(level+1)+" · "+Math.max(0,Math.ceil(levels[level].duration-elapsed))+"s";q("#scoreHud").textContent=String(Math.max(0,Math.floor(score))).padStart(5,"0");q("#heartsHud").textContent="♥".repeat(3-hits)+"♡".repeat(hits)}
function bind(btn,key){const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};btn.addEventListener("pointerdown",on);btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("pointerleave",off)}
bind(q("#left"),"left");bind(q("#right"),"right");
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")keys.left=true;if(e.key==="ArrowRight")keys.right=true});addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;if(e.key==="ArrowRight")keys.right=false});
function spawn(){const c=cfg[difficulty],size=level===0?26+Math.random()*18:level===1?30+Math.random()*22:34+Math.random()*27;objects.push({x:28+Math.random()*(W-56),y:-60,w:size,h:size,type:Math.random(),speed:c.speed*(.82+Math.random()*.45)*(1+level*.12),phase:Math.random()*6.28,hit:false})}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.35&&Math.abs(a.y-b.y)<(a.h+b.h)*.36}
function impact(o){if(o.hit||plane.inv>0)return;o.hit=true;hits++;score=Math.max(0,score-500);plane.inv=1.25;shell.classList.remove("flash");void shell.offsetWidth;shell.classList.add("flash");sfx("hit");navigator.vibrate?.([80,40,80]);for(let i=0;i<14;i++)particles.push({x:plane.x,y:plane.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.7});updateHud();if(hits>=3)end(false)}
function loop(now){if(state!=="play")return;const dt=Math.min(.033,(now-last)/1000);last=now;tick(dt);draw();if(state==="play")requestAnimationFrame(loop)}
function tick(dt){const c=cfg[difficulty],dir=(keys.right?1:0)-(keys.left?1:0);plane.x+=dir*245*dt;plane.x=Math.max(42,Math.min(W-42,plane.x));plane.tilt+=(dir*-.32-plane.tilt)*.16;plane.inv=Math.max(0,plane.inv-dt);elapsed+=dt;score+=dt*100*c.mult*(1+level*.35);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=c.spawn*(.72+Math.random()*.55)/(1+level*.12)}
objects.forEach(o=>{o.y+=o.speed*dt;o.x+=Math.sin(elapsed*2+o.phase)*(level===1?28:10)*dt;if(collide(plane,o))impact(o)});objects=objects.filter(o=>o.y<H+80&&!o.hit);
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0);updateHud();if(elapsed>=levels[level].duration)end(true)}
function pxRect(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function bg(){const t=elapsed;
if(level===0){pxRect(0,0,W,H,"#527d46");pxRect(48,0,W-96,H,"#454b52");for(let y=((t*cfg[difficulty].speed)%90)-90;y<H;y+=90){pxRect(W/2-4,y,8,46,"#f7f0bf")}pxRect(48,0,8,H,"#fff4ce");pxRect(W-56,0,8,H,"#fff4ce")}
if(level===1){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#09003f");g.addColorStop(.55,"#371087");g.addColorStop(1,"#007fa9");X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<8;i++){const y=(i*137+t*55)%930-60,x=(i*83)%W;X.fillStyle="#d8e2e6aa";X.beginPath();X.arc(x,y,30,0,7);X.arc(x+31,y+5,25,0,7);X.fill()}}
if(level===2){pxRect(0,0,W,H,"#1a075a");pxRect(0,H*.35,W,H*.65,"#08051f");for(let i=0;i<9;i++){const bw=36+(i%3)*11,bh=150+(i*53)%280,x=i*51-18;pxRect(x,H-bh,bw,bh,i%2?"#273551":"#303e5d");for(let yy=H-bh+18;yy<H-20;yy+=26)for(let xx=x+8;xx<x+bw-5;xx+=17)pxRect(xx,yy,6,9,(i+yy/26)%3?"#ffd65c":"#7591a8")}}
}
function drawPlane(){X.save();X.translate(plane.x,plane.y);X.rotate(plane.tilt);if(plane.inv>0&&Math.floor(plane.inv*12)%2===0)X.globalAlpha=.25;X.fillStyle="#f0eee3";X.beginPath();X.moveTo(0,-46);X.lineTo(11,-13);X.lineTo(48,8);X.lineTo(46,20);X.lineTo(10,13);X.lineTo(8,39);X.lineTo(20,47);X.lineTo(18,52);X.lineTo(0,47);X.lineTo(-18,52);X.lineTo(-20,47);X.lineTo(-8,39);X.lineTo(-10,13);X.lineTo(-46,20);X.lineTo(-48,8);X.lineTo(-11,-13);X.closePath();X.fill();pxRect(-6,-25,12,42,"#2374a3");pxRect(-35,10,12,8,"#111");pxRect(23,10,12,8,"#111");X.restore()}
function drawObject(o){X.save();X.translate(o.x,o.y);const z=o.w/34;X.scale(z,z);if(level===0){X.strokeStyle="#09001f";X.lineWidth=7;X.beginPath();X.moveTo(-17,4);X.lineTo(-5,-7);X.lineTo(0,2);X.lineTo(7,-9);X.lineTo(18,2);X.stroke();X.strokeStyle="#ffec35";X.lineWidth=3;X.stroke()}else if(level===1&&o.type<.45){X.fillStyle="#fff52e";X.strokeStyle="#00eaff";X.lineWidth=5;X.beginPath();X.moveTo(5,-21);X.lineTo(-8,1);X.lineTo(1,1);X.lineTo(-6,22);X.lineTo(15,-5);X.lineTo(5,-5);X.closePath();X.stroke();X.fill()}else if(level===1&&o.type<.72){X.fillStyle="#ff208c";X.strokeStyle="#080018";X.lineWidth=5;X.beginPath();X.arc(0,-5,14,0,7);X.fill();X.stroke();pxRect(-2,9,4,17,"#ffe22d")}else if(level===1){pxRect(-16,-12,32,25,"#ffad25");pxRect(-12,-8,24,17,"#6e1b68");pxRect(-4,-16,8,5,"#00eaff")}else if(o.type<.68){pxRect(-19,-5,38,11,"#9a31ff");pxRect(-4,-13,8,26,"#00eaff");pxRect(-27,-2,54,4,"#ffe22d");pxRect(-13,8,26,4,"#ff258c")}else{pxRect(-5,-25,10,50,"#ffe22d");pxRect(-18,-21,34,6,"#ff258c");pxRect(8,-18,5,40,"#00eaff")}X.restore()}
function draw(){bg();objects.forEach(drawObject);drawPlane();particles.forEach(p=>pxRect(p.x,p.y,5,5,p.t>.35?"#ffd43b":"#ee493b"))}
function end(win){if(state!=="play")return;state="ended";hud.classList.add("hidden");controls.classList.add("hidden");keys.left=keys.right=false;if(win){score+=1000*(level+1)*cfg[difficulty].mult;sfx("win");if(level<2){level++;q("#resultIcon").textContent="CLEAR";q("#resultTitle").textContent="LEVEL CLEARED!";q("#resultText").textContent="Kev and the King Air survive. Somehow. Next up: "+levels[level].name+".";q("#resultButton").textContent="Next level";q("#resultButton").onclick=brief}else{q("#resultIcon").textContent="ACE";q("#resultTitle").textContent="LINE RELEASED!";q("#resultText").textContent="All three sectors complete. Kev lives to fly another day.";q("#resultButton").textContent="Fly again";q("#resultButton").onclick=()=>{score=0;level=0;brief()}}}else{q("#resultIcon").textContent="OUCH";q("#resultTitle").textContent="AIRCRAFT BENT!";q("#resultText").textContent="Three hits. Engineering would like a quiet word with Kev.";q("#resultButton").textContent="Retry level";q("#resultButton").onclick=begin}q("#resultScore").textContent="SCORE "+Math.floor(score);show("#result")}
q("#menuButton").onclick=()=>{state="menu";hud.classList.add("hidden");controls.classList.add("hidden");show("#menu")};
function drawPoster(){pxRect(0,0,W,H,"#07002e");for(let i=0;i<16;i++){const x=(i*71)%W,y=80+(i*97)%480;pxRect(x,y,28+(i%4)*12,18,"#351279");pxRect(x+8,y-8,24,12,i%2?"#6a18b8":"#13228c")}X.strokeStyle="#7df9ff";X.lineWidth=6;for(let i=0;i<4;i++){X.beginPath();let x=55+i*103;X.moveTo(x,70);X.lineTo(x-18,145);X.lineTo(x+13,198);X.lineTo(x-4,275);X.stroke()}for(let i=0;i<13;i++){const x=i*34,h=45+(i*29)%105;pxRect(x,H*.58-h,27,h,i%2?"#12165c":"#28106a");for(let y=H*.58-h+10;y<H*.58;y+=17)pxRect(x+7,y,5,7,(i+y)%3?"#ff2baf":"#00eaff")}X.save();const ox=plane.x,oy=plane.y,ot=plane.tilt;plane.x=0;plane.y=0;plane.tilt=0;X.translate(235,340);X.rotate(-.15);X.scale(1.65,1.65);drawPlane();plane.x=ox;plane.y=oy;plane.tilt=ot;X.restore();pxRect(0,560,W,284,"#050019");pxRect(0,730,W,114,"#0b144c");X.fillStyle="#f0a16f";X.beginPath();X.arc(122,650,70,0,7);X.fill();pxRect(63,698,118,88,"#e8eef9");pxRect(112,702,24,92,"#07123d");pxRect(80,648,18,9,"#071027");pxRect(145,648,18,9,"#071027");pxRect(100,681,46,11,"#5c2927");pxRect(71,704,40,12,"#ffe435");pxRect(72,708,38,4,"#08113c");pxRect(280,665,100,90,"#10124f");for(let i=0;i<12;i++)pxRect(290+(i%4)*22,677+Math.floor(i/4)*22,10,10,["#00eaff","#ff248f","#ffe22d"][i%3])}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));drawPoster();
</script></body></html>

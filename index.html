<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07162d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="King Air Kev">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" sizes="512x512" href="kev-face-app-icon-v2.png"><link rel="apple-touch-icon-precomposed" href="kev-face-app-icon-v2.png"><link rel="icon" type="image/png" href="kev-face-app-icon-v2.png">
<title>King Air Kev</title>
<style>
:root{--ink:#05052b;--cream:#fff7c7;--gold:#ffe12b;--red:#ff246d;--blue:#00eaff;--purple:#741cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030814;color:white;font-family:ui-monospace,"Courier New",monospace;touch-action:none}
body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,480px);height:100dvh;max-height:900px;background:var(--ink);overflow:hidden;box-shadow:0 0 60px #000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));text-align:center;background:linear-gradient(180deg,#080845f2,#120532f2 55%,#03031df8);z-index:5}
.hidden{display:none}.logo{font-weight:1000;font-size:clamp(42px,13vw,70px);line-height:.88;letter-spacing:-4px;background:linear-gradient(#eaffff 5%,#00eaff 35%,#f226ff 65%,#ffe12b 88%);-webkit-background-clip:text;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:5px 5px 0 #080027,8px 8px 0 #ff178e;transform:skew(-3deg);margin:12px 0 18px}.logo span{display:block;color:var(--gold);font-size:.66em;-webkit-text-stroke:1px #ff246d;text-shadow:4px 4px #6c006f}
.badge{background:var(--red);border:4px solid var(--cream);box-shadow:5px 5px 0 #020612;padding:6px 12px;font-weight:900;transform:rotate(2deg);margin-bottom:12px}.kev{font-size:92px;filter:drop-shadow(5px 6px 0 #000);animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-7px)}}.sub{max-width:340px;color:#cbe8ff;line-height:1.4;font-weight:bold}.buttons{display:grid;gap:12px;width:min(100%,330px);margin-top:20px}
button{appearance:none;border:4px solid #fff4ce;border-radius:2px;background:#1670a8;color:white;padding:15px 12px;font:900 18px ui-monospace,monospace;letter-spacing:1px;box-shadow:5px 5px 0 #020612;text-transform:uppercase}button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #020612}.primary{background:#e64b32}.easy{background:#168f65}.medium{background:#c37a13}.hard{background:#b5263d}
#hud{position:absolute;z-index:3;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;font-weight:1000;text-shadow:2px 2px #000;pointer-events:none}.hudBox{background:#07162dcc;border:2px solid #fff4ce;padding:6px 8px;box-shadow:3px 3px #000}.hearts{color:#ff4b4b}
#controls{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:0 18px calc(15px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}.ctrl{pointer-events:auto;width:104px;height:70px;border-radius:12px;background:#07162dcf;font-size:33px;user-select:none}
.small{font-size:12px;color:#00eaff;margin-top:14px}.resultTitle{font-size:34px;color:var(--gold);text-shadow:3px 3px #ff167d,6px 6px #000;margin:8px}.scoreBig{font-size:24px;margin:10px}.flash{animation:flash .18s steps(2) 5}@keyframes flash{50%{opacity:.1}}
.shell:after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0004 4px);mix-blend-mode:multiply}
#boot{background:#020018 url("./assets/lightning-strikes-loading.webp") center/contain no-repeat;justify-content:flex-end;padding:0 0 calc(12px + env(safe-area-inset-bottom));cursor:pointer}#boot>div:first-child{display:none}
#boot .logo,#boot .tag{display:none}
.loadWrap{width:100%;display:flex;justify-content:center;margin:0}.loadFrame{display:none}.tap{margin:0;padding:8px 18px;border:2px solid #00eaff;background:#060025dd;color:#fff;font-size:13px;box-shadow:3px 3px #ff168b;font-weight:1000;animation:blink .8s steps(2) infinite}@keyframes blink{50%{opacity:.2}}
.kevPhoto{width:160px;height:190px;margin:4px;background:#060025 url("./assets/lightning-strikes-loading.webp") center 69%/360px auto no-repeat;border:5px solid #00eaff;box-shadow:7px 7px #ff168b;image-rendering:pixelated}.endPoster{width:142px;height:252px;background:#020018 url("./assets/lightning-strikes-loading.webp") center/contain no-repeat;border:5px solid #00eaff;box-shadow:7px 7px #ff168b;image-rendering:pixelated;margin:3px}.pixelBadge{display:grid;place-items:center;width:106px;height:80px;background:#ff246d;border:5px solid #00eaff;box-shadow:7px 7px #080018;font-weight:1000;font-size:20px;color:#ffe12b}.miniSprite{width:94px;height:60px;margin:12px;background:linear-gradient(155deg,transparent 35%,#f7f2df 36% 60%,transparent 61%);filter:drop-shadow(6px 5px #ff168b) drop-shadow(-4px -2px #00eaff)}
</style>
</head>
<body><main class="shell" id="shell">
<canvas id="game" width="390" height="844"></canvas>
<div id="hud" class="hidden"><div class="hudBox" id="levelHud">LEVEL 1</div><div class="hudBox"><span id="scoreHud">00000</span> <span class="hearts" id="heartsHud">♥♥♥</span></div></div>
<div id="controls" class="hidden"><button class="ctrl" id="left" aria-label="Move left">◀</button><button class="ctrl" id="right" aria-label="Move right">▶</button></div>
<section id="boot" class="screen"><div><div class="logo">KING AIR KEV</div><div class="tag">LIGHTNING STRIKES</div></div><div class="loadWrap"><div class="loadFrame"><div class="loadFill" id="loadFill"></div></div><button class="primary tap" id="bootButton">TAP FOR MUSIC & START</button></div></section>\n<section id="menu" class="screen hidden"><div class="badge">16-BIT FLIGHT MAYHEM</div><div class="logo">KING AIR<span>KEV</span></div><div class="kevPhoto" aria-label="King Air Kev"></div><p class="sub">Guide Kev's King Air through three increasingly ridiculous flights. Dodge everything. Try not to bend the aeroplane.</p><div class="buttons"><button class="primary" id="start">Start engines</button></div><div class="small">HEADPHONES ON · PORTRAIT MODE</div></section>
<section id="difficulty" class="screen hidden"><div class="logo" style="font-size:46px">CHOOSE<span>DIFFICULTY</span></div><div class="buttons"><button class="easy" data-diff="easy">Easy · Training</button><button class="medium" data-diff="medium">Medium · Line Check</button><button class="hard" data-diff="hard">Hard · Kev Mode</button></div></section>
<section id="brief" class="screen hidden"><div class="badge" id="briefBadge">LEVEL 1</div><div class="resultTitle" id="briefTitle">BIRD STRIKE ALLEY</div><div class="miniSprite" id="briefIcon"></div><p class="sub" id="briefText"></p><div class="buttons"><button class="primary" id="launch">Let's fly</button></div></section>
<section id="result" class="screen hidden"><div class="pixelBadge" id="resultIcon">KEV</div><div class="resultTitle" id="resultTitle">AIRCRAFT BENT!</div><p class="sub" id="resultText"></p><div class="scoreBig" id="resultScore"></div><div class="buttons"><button class="primary" id="resultButton">Retry</button><button id="menuButton">Main menu</button></div></section>
</main>
<script>
"use strict";
const C=document.querySelector("#game"),X=C.getContext("2d"),W=C.width,H=C.height;
const screens=[...document.querySelectorAll(".screen")],hud=q("#hud"),controls=q("#controls"),shell=q("#shell");
const cfg={easy:{speed:175,spawn:1.05,mult:1},medium:{speed:220,spawn:.78,mult:1.5},hard:{speed:275,spawn:.57,mult:2}};
const levels=[
 {name:"BIRD STRIKE ALLEY",text:"Walney runway is full of birds. Steer left and right, avoid three strikes and reach rotation.",duration:20},
 {name:"TURBULENCE TROUBLE",text:"Climb through the storm and dodge the lightning strikes.",duration:20},
 {name:"AROUND THE WORLD",text:"Fly the King Air around the curve of Earth. Use UP and DOWN to avoid birds and lightning.",duration:20}
];
let state="boot",difficulty="medium",level=0,score=0,hits=0,elapsed=0,last=0,spawnClock=0,objects=[],particles=[],keys={left:false,right:false},audio=null,musicTimer=null;
let plane={x:195,y:665,w:60,h:88,tilt:0,inv:0};
function q(s){return document.querySelector(s)}
function show(id){screens.forEach(s=>s.classList.add("hidden"));q(id).classList.remove("hidden")}
function resize(){const r=C.getBoundingClientRect();C.width=Math.round(r.width*devicePixelRatio);C.height=Math.round(r.height*devicePixelRatio);X.setTransform(C.width/W,0,0,C.height/H,0,0)}
addEventListener("resize",resize);resize();
function tone(freq,dur,vol=.035,type="square"){if(!audio||audio.state!=="running")return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur)}
function startAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();audio.resume().then(()=>{if(musicTimer)return;let step=0;const lead=[330,392,494,659,494,392,330,247,294,370,494,587,494,370,294,247,330,415,523,659,523,415,330,262,294,370,440,587,440,370,294,220],bass=[82,82,110,110,73,73,98,98];const beat=()=>{tone(lead[step%lead.length],.13,.075,"square");if(step%2===0)tone(bass[(step>>1)%bass.length],.27,.055,"triangle");if(step%4===0)tone(58,.07,.07,"square");if(step%8===4)tone(1800,.025,.025,"square");step++};beat();musicTimer=setInterval(beat,145)}).catch(()=>{})}
document.addEventListener("pointerdown",()=>{if(audio&&audio.state==="suspended")audio.resume()},{passive:true});document.addEventListener("visibilitychange",()=>{if(!document.hidden&&audio)audio.resume()});
function sfx(type){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==="hit"?"sawtooth":"square";o.frequency.setValueAtTime(type==="hit"?180:440,t);o.frequency.exponentialRampToValueAtTime(type==="hit"?55:880,t+.18);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(audio.destination);o.start();o.stop(t+.21)}
q("#boot").onclick=()=>{if(state!=="boot")return;startAudio();q("#bootButton").textContent="MUSIC ON · LOADING...";setTimeout(()=>{state="menu";show("#menu")},1800)};
q("#start").onclick=()=>{startAudio();show("#difficulty")};
document.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;score=0;level=0;brief()});
function brief(){const l=levels[level];q("#briefBadge").textContent="LEVEL "+(level+1)+" OF 3";q("#briefTitle").textContent=l.name;q("#briefIcon").dataset.level=level;q("#briefText").textContent=l.text;show("#brief")}
q("#launch").onclick=()=>{startAudio();begin()};
function begin(){state="play";hits=0;elapsed=0;spawnClock=0;objects=[];particles=[];plane.x=level===2?96:W/2;plane.y=level===2?365:665;plane.w=level===2?108:60;plane.h=level===2?48:88;plane.tilt=0;plane.inv=0;q("#left").textContent=level===2?"▲":"◀";q("#right").textContent=level===2?"▼":"▶";q("#left").setAttribute("aria-label",level===2?"Fly up":"Move left");q("#right").setAttribute("aria-label",level===2?"Fly down":"Move right");last=performance.now();screens.forEach(s=>s.classList.add("hidden"));hud.classList.remove("hidden");controls.classList.remove("hidden");updateHud();requestAnimationFrame(loop)}
function updateHud(){q("#levelHud").textContent="LEVEL "+(level+1)+" · "+Math.max(0,Math.ceil(levels[level].duration-elapsed))+"s";q("#scoreHud").textContent=String(Math.max(0,Math.floor(score))).padStart(5,"0");q("#heartsHud").textContent="♥".repeat(3-hits)+"♡".repeat(hits)}
function bind(btn,key){const on=e=>{e.preventDefault();keys[key]=true},off=e=>{e.preventDefault();keys[key]=false};btn.addEventListener("pointerdown",on);btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("pointerleave",off)}
bind(q("#left"),"left");bind(q("#right"),"right");
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowUp")keys.left=true;if(e.key==="ArrowRight"||e.key==="ArrowDown")keys.right=true});addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key==="ArrowUp")keys.left=false;if(e.key==="ArrowRight"||e.key==="ArrowDown")keys.right=false});
function spawn(){const c=cfg[difficulty],size=level===0?26+Math.random()*18:level===1?30+Math.random()*22:30+Math.random()*18;const o={w:size,h:size,type:Math.random(),speed:c.speed*(.82+Math.random()*.45)*(1+level*.12),phase:Math.random()*6.28,hit:false};if(level===2){o.x=W+65;o.y=115+Math.random()*(H-390)}else{o.x=28+Math.random()*(W-56);o.y=-60}objects.push(o)}
function collide(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.35&&Math.abs(a.y-b.y)<(a.h+b.h)*.36}
function impact(o){if(o.hit||plane.inv>0)return;o.hit=true;hits++;score=Math.max(0,score-500);plane.inv=1.25;shell.classList.remove("flash");void shell.offsetWidth;shell.classList.add("flash");sfx("hit");navigator.vibrate?.([80,40,80]);for(let i=0;i<14;i++)particles.push({x:plane.x,y:plane.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,t:.7});updateHud();if(hits>=3)end(false)}
function loop(now){if(state!=="play")return;const dt=Math.min(.033,(now-last)/1000);last=now;tick(dt);draw();if(state==="play")requestAnimationFrame(loop)}
function tick(dt){const c=cfg[difficulty],dir=(keys.right?1:0)-(keys.left?1:0);if(level===2){plane.y+=dir*235*dt;plane.y=Math.max(115,Math.min(H-275,plane.y));plane.x=96;plane.tilt+=(dir*.16-plane.tilt)*.16}else{plane.x+=dir*245*dt;plane.x=Math.max(42,Math.min(W-42,plane.x));plane.tilt+=(dir*-.32-plane.tilt)*.16}plane.inv=Math.max(0,plane.inv-dt);elapsed+=dt;score+=dt*100*c.mult*(1+level*.35);spawnClock-=dt;if(spawnClock<=0){spawn();spawnClock=c.spawn*(.72+Math.random()*.55)/(1+level*.12)}
objects.forEach(o=>{if(level===2){o.x-=o.speed*dt;o.y+=Math.sin(elapsed*3+o.phase)*9*dt}else{o.y+=o.speed*dt;o.x+=Math.sin(elapsed*2+o.phase)*(level===1?28:10)*dt}if(collide(plane,o))impact(o)});objects=objects.filter(o=>(level===2?o.x>-90:o.y<H+80)&&!o.hit);
particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0);updateHud();if(elapsed>=levels[level].duration)end(true)}
function pxRect(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function bg(){const t=elapsed;
if(level===0){pxRect(0,0,W,H,"#527d46");pxRect(48,0,W-96,H,"#454b52");for(let y=((t*cfg[difficulty].speed)%90)-90;y<H;y+=90){pxRect(W/2-4,y,8,46,"#f7f0bf")}pxRect(48,0,8,H,"#fff4ce");pxRect(W-56,0,8,H,"#fff4ce")}
if(level===1){const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,"#09003f");g.addColorStop(.55,"#371087");g.addColorStop(1,"#007fa9");X.fillStyle=g;X.fillRect(0,0,W,H);for(let i=0;i<8;i++){const y=(i*137+t*55)%930-60,x=(i*83)%W;X.fillStyle="#d8e2e6aa";X.beginPath();X.arc(x,y,30,0,7);X.arc(x+31,y+5,25,0,7);X.fill()}}
if(level===2){pxRect(0,0,W,H,"#030018");for(let i=0;i<34;i++){const x=((i*83-t*32)%(W+20)+W+20)%(W+20),y=70+(i*47)%470,sz=i%7===0?4:2;pxRect(x,y,sz,sz,i%5===0?"#00eaff":"#fff")}X.save();X.beginPath();X.arc(W/2,H+115,365,0,Math.PI*2);X.clip();X.fillStyle="#087bd8";X.fillRect(-180,H-250,W+360,480);for(let k=-1;k<4;k++){const shift=((k*170-t*38)%(W+300));poly([[shift,H-155],[shift+50,H-215],[shift+115,H-190],[shift+142,H-105],[shift+75,H-72],[shift+18,H-98]],k%2?"#23a85b":"#36c96c");poly([[shift+70,H-25],[shift+120,H-80],[shift+190,H-66],[shift+205,H+12]],"#168c50")}for(let i=0;i<14;i++){const x=((i*79-t*55)%(W+100)+W+100)%(W+100)-50,y=H-215+(i*37)%175;pxRect(x,y,55,8,"#b9f2ff88")}X.restore();X.strokeStyle="#00eaff";X.lineWidth=12;X.beginPath();X.arc(W/2,H+115,371,Math.PI,Math.PI*2);X.stroke();X.strokeStyle="#744bff";X.lineWidth=5;X.beginPath();X.arc(W/2,H+115,382,Math.PI,Math.PI*2);X.stroke()}
}
function drawPlane(){X.save();X.translate(plane.x,plane.y);X.rotate(plane.tilt);if(plane.inv>0&&Math.floor(plane.inv*12)%2===0)X.globalAlpha=.25;X.fillStyle="#f0eee3";X.beginPath();X.moveTo(0,-46);X.lineTo(11,-13);X.lineTo(48,8);X.lineTo(46,20);X.lineTo(10,13);X.lineTo(8,39);X.lineTo(20,47);X.lineTo(18,52);X.lineTo(0,47);X.lineTo(-18,52);X.lineTo(-20,47);X.lineTo(-8,39);X.lineTo(-10,13);X.lineTo(-46,20);X.lineTo(-48,8);X.lineTo(-11,-13);X.closePath();X.fill();pxRect(-6,-25,12,42,"#2374a3");pxRect(-35,10,12,8,"#111");pxRect(23,10,12,8,"#111");X.restore()}
function drawSidePlane(){X.save();X.translate(plane.x,plane.y);X.rotate(plane.tilt);if(plane.inv>0&&Math.floor(plane.inv*12)%2===0)X.globalAlpha=.25;X.shadowColor="#00eaff";X.shadowBlur=7;poly([[-52,-3],[-40,-15],[22,-16],[48,-8],[57,0],[49,8],[-35,10],[-53,4]],"#f1f3f4");poly([[-26,-13],[-36,-34],[-26,-34],[-7,-14]],"#d9deec");poly([[-15,7],[-38,27],[-27,29],[7,8]],"#bec9df");poly([[-42,-12],[-49,-28],[-40,-28],[-29,-13]],"#eef2fa");pxRect(17,-12,17,8,"#072a51");pxRect(-2,-11,7,6,"#07537a");pxRect(-13,-11,7,6,"#07537a");pxRect(-24,-11,7,6,"#07537a");pxRect(-18,3,44,3,"#ff257f");pxRect(-32,-2,8,12,"#11142f");pxRect(8,-3,8,12,"#11142f");X.strokeStyle="#d9f7ff88";X.lineWidth=3;X.beginPath();X.arc(-28,4,18,0,7);X.arc(12,3,18,0,7);X.stroke();X.shadowBlur=0;X.restore()}
function poly(points,c){X.fillStyle=c;X.beginPath();X.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)X.lineTo(points[i][0],points[i][1]);X.closePath();X.fill()}
function drawBolt(){X.shadowColor="#00eaff";X.shadowBlur=8;poly([[5,-23],[-10,1],[-1,1],[-8,23],[16,-7],[6,-7]],"#fff52e");X.shadowBlur=0;X.strokeStyle="#fff";X.lineWidth=2;X.stroke()}
function drawBird(k){const pal=[["#eef5ff","#8293a9","#ffcb31"],["#9b633e","#e5b16f","#ff8b20"],["#1d2840","#586b8d","#ffdf35"]][k%3];X.shadowColor="#00eaff";X.shadowBlur=4;poly([[-4,-16],[4,-16],[8,-5],[5,16],[0,23],[-5,16],[-8,-5]],pal[0]);poly([[-5,-7],[-30,-17],[-22,3],[-7,9]],pal[1]);poly([[5,-7],[30,-17],[22,3],[7,9]],pal[1]);poly([[-5,14],[-12,25],[0,21],[12,25],[5,14]],pal[1]);pxRect(-4,-19,8,7,pal[0]);poly([[4,-18],[12,-15],[4,-12]],pal[2]);pxRect(1,-18,2,2,"#050018");X.shadowBlur=0}
function drawObject(o){X.save();X.translate(o.x,o.y);const z=o.w/34;X.scale(z,z);if(level===0)drawBird(Math.floor(o.type*3));else if(level===1)drawBolt();else if(o.type<.58)drawBird(Math.floor(o.type*5));else drawBolt();X.restore()}
function draw(){bg();objects.forEach(drawObject);if(level===2)drawSidePlane();else drawPlane();particles.forEach(p=>pxRect(p.x,p.y,5,5,p.t>.35?"#ffd43b":"#ee493b"))}
function end(win){if(state!=="play")return;state="ended";hud.classList.add("hidden");controls.classList.add("hidden");keys.left=keys.right=false;const ri=q("#resultIcon");ri.className="pixelBadge";if(win){score+=1000*(level+1)*cfg[difficulty].mult;sfx("win");if(level<2){level++;q("#resultIcon").textContent="CLEAR";q("#resultTitle").textContent="LEVEL CLEARED!";q("#resultText").textContent="Kev and the King Air survive. Somehow. Next up: "+levels[level].name+".";q("#resultButton").textContent="Next level";q("#resultButton").onclick=brief}else{ri.className="endPoster";ri.textContent="";q("#resultTitle").textContent="GAME COMPLETE";q("#resultText").textContent="King Air Kev has survived all three levels!";q("#resultButton").textContent="Fly again";q("#resultButton").onclick=()=>{score=0;level=0;brief()}}}else{q("#resultIcon").textContent="OUCH";q("#resultTitle").textContent="AIRCRAFT BENT!";q("#resultText").textContent="Three hits. Engineering would like a quiet word with Kev.";q("#resultButton").textContent="Retry level";q("#resultButton").onclick=begin}q("#resultScore").textContent="SCORE "+Math.floor(score);show("#result")}
